name: Deploy Frontend

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history: tools/build-sitemap.mjs dates every page by the last
      # commit that touched it. On a shallow clone that is always "now", so
      # every deploy stamped every page as changed and Google learns to ignore
      # the sitemap's lastmod entirely.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Upload build to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/beehivemind-Front/
          remote_path: /var/www/front/dist/beehivemind-Front/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: pm2 restart beehivemind-front

      # After the restart, so the key file and the fresh sitemap are what the
      # engine fetches. A failure here must not fail the deploy: the site is up.
      - name: Tell Bing what changed (IndexNow)
        run: sleep 20 && node tools/indexnow.mjs || echo "indexnow ping failed; the sitemap still covers it"
