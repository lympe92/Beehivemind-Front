<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BeehiveMind</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Every URL in this document is root-absolute, and `deployUrl` in
       angular.json makes the build's own script and style tags the same. The
       `<base href>` would resolve relative ones for a browser, but not for every
       crawler: GPTBot fetched `/blog/chunk-….js` and `/blog/category/assets/…`
       from the blog pages and left with 404s. -->
  <!-- The bee mark, traced from the design system's logo-mark.png, on a white
       rounded tile: bare ink vanishes into a dark tab strip. The ICO (16/32/48)
       is for browsers without SVG icons; `sizes` on it is what stops Chrome from
       choosing it over the SVG. iOS rounds the touch icon itself, so that one is
       a plain white square. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Feed autodiscovery. Served by /rss.xml in server.ts, built from the
       console's published posts. -->
  <link rel="alternate" type="application/rss+xml" title="BeehiveMind blog" href="/rss.xml">
  <!-- The blog's images live on the API's origin. Opening that connection
       alongside the page, rather than when the first <img> is reached, takes
       the DNS, TCP and TLS round trips off the article's largest paint. -->
  <link rel="preconnect" href="https://api.beehivemind.tech">
  <link rel="dns-prefetch" href="https://api.beehivemind.tech">
  <!-- Peridot PE is self-hosted: one variable file, declared in styles/tokens/fonts.css. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/assets/fonts/peridot-pe-variable.woff2">
  <!-- The face Peridot swaps in over, cut to Peridot's measurements so the
       swap does not reflow the page (the reasoning is in styles/tokens/fonts.css,
       the numbers come from tools/font-metrics.mjs). It lives here rather than
       in the stylesheet because the build inlines only each page's critical CSS
       and leaves this face out; the full sheet arrives later, and until it did
       the first paint used system-ui and the swap moved every hero by a CLS of
       0.09–0.10 on a phone. A face in the document head is there from the
       first byte. -->
  <style>
    @font-face {
      font-family: "Peridot Fallback";
      font-style: normal;
      font-weight: 400 700;
      src: local("Arial"), local("Helvetica"), local("Liberation Sans");
      size-adjust: 105.63%;
      ascent-override: 94.67%;
      descent-override: 21.77%;
      line-gap-override: 0%;
    }
  </style>
  <!-- The company as an entity, sitewide. It carries no `data-seo` attribute on
       purpose: SeoService only clears its own nodes, so this one survives every
       navigation and is present even on the client-rendered signed-in routes.
       `sameAs` are the profiles listed in the footer — only the ones that
       resolve; a profile that 404s tells a crawler the entity is stale. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "BeehiveMind",
    "url": "https://beehivemind.tech",
    "logo": "https://beehivemind.tech/assets/img/logo.webp",
    "description": "Beehive management software for working beekeepers, recorded by voice and usable offline from the apiary.",
    "foundingDate": "2019",
    "email": "info@beehivemind.tech",
    "address": { "@type": "PostalAddress", "addressCountry": "GR" },
    "knowsLanguage": ["en", "el"],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "email": "info@beehivemind.tech",
      "url": "https://beehivemind.tech/contact",
      "availableLanguage": ["en", "el"]
    },
    "sameAs": [
      "https://www.instagram.com/beehivemindapp",
      "https://www.tiktok.com/@beehivemind.tech",
      "https://www.youtube.com/channel/UCSacxrpIMgWoWhLORBY5HcQ"
    ]
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
