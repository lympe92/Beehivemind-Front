<div class="flex-col lg:flex-row gap-band">
  <div class="md:w-full lg:w-half self-center">
    <h1>{{ title() }}</h1>
    <p class="hero-left__subtitle">{{ subtitle() }}</p>
    <div class="hero-left__actions">
      <app-link
        [routerLink]="primaryCta().routerLink"
        [variant]="primaryCta().variant ?? 'primary'"
        [size]="primaryCta().size ?? 'md'">
        {{ primaryCta().label }}
      </app-link>
      <app-link
        [routerLink]="secondaryCta().routerLink"
        [variant]="secondaryCta().variant ?? 'outline'"
        [size]="secondaryCta().size ?? 'md'">
        {{ secondaryCta().label }}
      </app-link>
    </div>
    @if (proof().length) {
      <ul class="hero-left__proof">
        @for (item of proof(); track item) {
          <li>{{ item }}</li>
        }
      </ul>
    }
  </div>
  <div class="md:w-full lg:w-half hero-left__media">
    <app-image
      [src]="image().src"
      [alt]="image().alt"
      [width]="image().width"
      [height]="image().height"
      [priority]="image().priority ?? false" />
  </div>
</div>
