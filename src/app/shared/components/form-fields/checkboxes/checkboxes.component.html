<div class="form-group checkbox-group">
  @if (label) {
    <span class="checkbox-group__label">{{ label }}{{ isRequired ? ' *' : '' }}</span>
  }
  <div class="checkbox-group__options" [class.row]="direction === 'row'">
    @for (option of options; track option.returnValue; let i = $index) {
      <label class="checkbox-group__option">
        <input
          type="checkbox"
          [checked]="isChecked(option.returnValue)"
          [disabled]="disabled"
          (change)="onToggleOption(option.returnValue)"
        />
        <span class="checkbox-group__option--label">{{ option.displayValue }}</span>
      </label>
    }
  </div>
  <app-form-errors
    [errors]="saFormControlName?.valid === false && saFormControlName?.touched ? (saFormControlName?.control?.errors ?? null) : null"
  />
</div>
