<div class="form-group">
  @if (label) {
    <label class="form-label">{{ label }}{{ isRequired ? ' *' : '' }}</label>
  }

  <div class="rte" [class.rte--disabled]="disabled">
    <!-- Rendered before the editor exists so the field does not jump when the
         dynamic import lands; the buttons simply do nothing until `ready`. -->
    <div class="rte__bar" role="toolbar" aria-label="Formatting" aria-controls="rte-body">
      <div class="rte__group">
        <button type="button" class="rte__btn" [class.is-active]="active()['h2']"
                [disabled]="!ready() || disabled" aria-label="Heading"
                (mousedown)="$event.preventDefault()" (click)="toggleBlock('h2')">H2</button>
        <button type="button" class="rte__btn" [class.is-active]="active()['h3']"
                [disabled]="!ready() || disabled" aria-label="Subheading"
                (mousedown)="$event.preventDefault()" (click)="toggleBlock('h3')">H3</button>
      </div>

      <div class="rte__group">
        <button type="button" class="rte__btn rte__btn--bold" [class.is-active]="active()['bold']"
                [disabled]="!ready() || disabled" aria-label="Bold"
                (mousedown)="$event.preventDefault()" (click)="toggleMark('bold')">B</button>
        <button type="button" class="rte__btn rte__btn--italic" [class.is-active]="active()['italic']"
                [disabled]="!ready() || disabled" aria-label="Italic"
                (mousedown)="$event.preventDefault()" (click)="toggleMark('italic')">I</button>
        <button type="button" class="rte__btn" [class.is-active]="active()['link']"
                [disabled]="!ready() || disabled" aria-label="Link"
                (mousedown)="$event.preventDefault()" (click)="toggleMark('link')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </button>
      </div>

      <div class="rte__group">
        <button type="button" class="rte__btn" [class.is-active]="active()['bulletList']"
                [disabled]="!ready() || disabled" aria-label="Bulleted list"
                (mousedown)="$event.preventDefault()" (click)="toggleBlock('bulletList')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        </button>
        <button type="button" class="rte__btn" [class.is-active]="active()['orderedList']"
                [disabled]="!ready() || disabled" aria-label="Numbered list"
                (mousedown)="$event.preventDefault()" (click)="toggleBlock('orderedList')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M4 14h2v2H4v2h2"/></svg>
        </button>
        <button type="button" class="rte__btn" [class.is-active]="active()['blockquote']"
                [disabled]="!ready() || disabled" aria-label="Quote"
                (mousedown)="$event.preventDefault()" (click)="toggleBlock('blockquote')">”</button>
        <button type="button" class="rte__btn" [class.is-active]="active()['codeBlock']"
                [disabled]="!ready() || disabled" aria-label="Code block"
                (mousedown)="$event.preventDefault()" (click)="toggleBlock('codeBlock')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l-6-6 6-6M15 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="rte__group">
        <button type="button" class="rte__btn" [disabled]="!ready() || disabled" aria-label="Insert image"
                (mousedown)="$event.preventDefault()" (click)="requestImage()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-6 6-2-2-5 5"/></svg>
        </button>
        <button type="button" class="rte__btn" [disabled]="!ready() || disabled" aria-label="Clear formatting"
                (mousedown)="$event.preventDefault()" (click)="clearFormatting()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h14M9 20h8M15 4L9 20"/><path d="M4 15l5 5M9 15l-5 5"/></svg>
        </button>
      </div>

      <div class="rte__group rte__group--end">
        <button type="button" class="rte__btn" [disabled]="!canUndo() || disabled" aria-label="Undo"
                (mousedown)="$event.preventDefault()" (click)="undo()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>
        </button>
        <button type="button" class="rte__btn" [disabled]="!canRedo() || disabled" aria-label="Redo"
                (mousedown)="$event.preventDefault()" (click)="redo()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg>
        </button>
      </div>
    </div>

    <!-- TipTap replaces the contents of this element on the client. Server-side
         it stays empty, which is correct: the article body is not public here. -->
    <div id="rte-body" class="rte__body prose" #host></div>
  </div>

  @if (displayErrors) {
    <app-form-errors
      [errors]="saFormControlName?.valid === false && saFormControlName?.touched ? (saFormControlName?.control?.errors ?? null) : null"
    />
  }
</div>
