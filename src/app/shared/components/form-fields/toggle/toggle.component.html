<div class="form-group">
  <button
    type="button"
    role="switch"
    class="toggle-row"
    [class.disabled]="disabled"
    [attr.aria-checked]="checked"
    [disabled]="disabled"
    (click)="toggle()">
    <span class="toggle-track" [class.checked]="checked" [class.invalid]="isFieldValid()">
      <span class="toggle-thumb"></span>
    </span>
    @if (label) {
      <span class="toggle-label">{{ label }}{{ isRequired ? ' *' : '' }}</span>
    }
  </button>
  @if (hint) {
    <p class="toggle-hint">{{ hint }}</p>
  }
  <app-form-errors
    [errors]="saFormControlName?.valid === false && saFormControlName?.touched ? (saFormControlName?.control?.errors ?? null) : null"
  />
</div>
