<div>
  <div class="radio-group" [class.column]="direction === 'column'">
    @if (label) {
      <span class="radio-group__label">{{ label }}{{ isRequired ? ' *' : '' }}</span>
    }
    @for (option of options; track option.returnValue) {
      <label class="radio-group__option">
        <input
          type="radio"
          [name]="groupName"
          [checked]="value != null && value === option.returnValue"
          [disabled]="disabled"
          (change)="onUpdateValue(option.returnValue)"
        />
        <span class="radio-group__option--label">{{ option.displayValue }}</span>
      </label>
    }
  </div>
  <app-form-errors
    [errors]="saFormControlName?.valid === false && saFormControlName?.touched ? (saFormControlName?.control?.errors ?? null) : null"
  />
</div>
