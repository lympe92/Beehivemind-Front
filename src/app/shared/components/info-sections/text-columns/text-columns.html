<div class="container">
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-band">
    @for (column of columns(); track column.title) {
      <div>
        @if (level() === 2) {
          <h2 class="text-center">{{ column.title }}</h2>
        } @else {
          <h3 class="text-center">{{ column.title }}</h3>
        }
        <p>{{ column.description }}</p>
      </div>
    }
  </div>
</div>
