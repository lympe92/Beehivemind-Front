<div class="container">
  <div class="split-content__row" [class.split-content__row--media-end]="mediaSide() === 'end'">
    <div class="split-content__media">
      <app-image
        [src]="image().src"
        [alt]="image().alt"
        [width]="image().width"
        [height]="image().height"
        [priority]="image().priority ?? false" />
    </div>
    <div class="split-content__body">
      <h2>{{ title() }}</h2>
      <p class="split-content__description">{{ description() }}</p>
      @if (steps().length) {
        <ol class="split-content__steps">
          @for (step of steps(); track step.title) {
            <li>
              <span class="split-content__step-title">{{ step.title }}</span>
              <span class="split-content__step-body">{{ step.body }}</span>
            </li>
          }
        </ol>
      }
    </div>
  </div>
</div>
