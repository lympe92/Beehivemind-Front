<div class="container">
  <h2 class="info-columns__title text-center">{{ title() }}</h2>
  <div class="grid md:grid-cols-3 gap-band">
    @for (item of items(); track item.title) {
      <div class="info-columns__item text-center">
        <p class="info-columns__figure">{{ item.title }}</p>
        <p class="info-columns__label">{{ item.description }}</p>
      </div>
    }
  </div>
</div>
