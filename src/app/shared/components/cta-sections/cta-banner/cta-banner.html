<div class="container">
  <div class="flex-col">
    <h2 class="cta-banner__title">{{ title() }}</h2>
    @if (description()) {
      <p class="cta-banner__text">{{ description() }}</p>
    }
  </div>

  <div class="cta-banner__action">
    <app-link
      [routerLink]="cta().routerLink"
      [variant]="cta().variant ?? 'primary'"
      [size]="cta().size ?? 'md'">
      {{ cta().label }}
    </app-link>
    @if (secondary(); as second) {
      <app-link
        [routerLink]="second.routerLink"
        [variant]="second.variant ?? 'outline'"
        [size]="second.size ?? 'md'">
        {{ second.label }}
      </app-link>
    }
  </div>
</div>
