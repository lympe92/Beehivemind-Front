<div class="flex-col lg:flex-row gap-band">
  <div class="w-full lg:w-half">
    <h2>{{ title() }}</h2>
    <app-image
      [src]="image().src"
      [alt]="image().alt"
      [width]="image().width"
      [height]="image().height"
      [priority]="image().priority ?? false" />
  </div>
  <div class="w-full lg:w-half">
    <div>
      @for (item of items(); track item.title; let i = $index) {
        <div class="split-accordion__row">
          <button
            type="button"
            class="split-accordion__header"
            [attr.aria-expanded]="open() === i"
            (click)="toggle(i)">
            <span>{{ item.title }}</span>
            <span class="split-accordion__chevron" aria-hidden="true">»</span>
          </button>
          @if (open() === i) {
            <div class="split-accordion__body">
              <p>{{ item.body }}</p>
              @if (item.linkHref) {
                @if (isExternal(item.linkHref)) {
                  <a [href]="item.linkHref" target="_blank" rel="noopener noreferrer">{{ item.linkLabel }}</a>
                } @else {
                  <a [routerLink]="item.linkHref">{{ item.linkLabel }}</a>
                }
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
