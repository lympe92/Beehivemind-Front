<div class="container">
  <div class="split-list__row" [class.split-list__row--media-start]="mediaSide() === 'start'">
    <div class="split-list__body">
      <h2>{{ title() }}</h2>
      <div class="split-list__items">
        @for (item of items(); track item.title) {
          <div>
            <h3>{{ item.title }}</h3>
            <p>{{ item.description }}</p>
          </div>
        }
      </div>
    </div>
    <div class="split-list__media">
      <app-image
        [src]="image().src"
        [alt]="image().alt"
        [width]="image().width"
        [height]="image().height"
        [priority]="image().priority ?? false" />
    </div>
  </div>
  <div class="text-center split-list__cta">
    <app-link
      [routerLink]="cta().routerLink"
      [variant]="cta().variant ?? 'outline'"
      [size]="cta().size ?? 'md'">
      {{ cta().label }}
    </app-link>
  </div>
</div>
