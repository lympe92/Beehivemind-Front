<div class="toast-container">
  @for (toast of toasts(); track toast.id) {
    <div class="toast toast--{{ toast.type }}" [attr.role]="toast.type === 'error' ? 'alert' : 'status'">
      <span class="toast__icon">
        <!-- Stroke SVGs in currentColor, like every other icon in the product.
             Success and error are the mark alone; warning and info sit in a
             shape, because a tick inside a circle closes up at 18px. -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @switch (toast.type) {
            @case ('success') { <path d="M20 6L9 17l-5-5" /> }
            @case ('error')   { <path d="M18 6L6 18M6 6l12 12" /> }
            @case ('warning') { <path d="M12 3.5L2.5 20h19L12 3.5z" /><path d="M12 9v5" /><path d="M12 17.5v.5" /> }
            @default          { <circle cx="12" cy="12" r="9.5" /><path d="M12 11v6" /><path d="M12 7.5v.5" /> }
          }
        </svg>
      </span>
      <div class="toast__body">
        @if (toast.title) {
          <div class="toast__title">{{ toast.title }}</div>
        }
        <div class="toast__message">{{ toast.message }}</div>
      </div>
      @if (toast.closable) {
        <button class="toast__close" type="button" (click)="toastService.dismiss(toast.id)" aria-label="Dismiss">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      }
    </div>
  }
</div>
