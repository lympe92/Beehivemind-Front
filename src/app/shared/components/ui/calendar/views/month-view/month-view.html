<div class="cal-month__weekdays">
  @for (w of WEEKDAYS; track w) {
    <div class="cal-month__weekday">{{ w }}</div>
  }
</div>

<div class="cal-month__grid">
  @for (day of days(); track day.date.getTime()) {
    <button
      type="button"
      class="cal-month__day"
      [class.cal-month__day--other]="!day.isCurrentMonth"
      (click)="dayClick.emit(day.date)">

      <span class="cal-month__num" [class.cal-month__num--today]="day.isToday">
        {{ day.date.getDate() }}
      </span>

      @for (ev of day.events.slice(0, MAX_PILLS); track ev.id) {
        <span
          class="cal-event"
          role="button"
          tabindex="0"
          [style.background]="chipBg(ev.color)"
          [style.box-shadow]="chipBar(ev.color)"
          [title]="ev.title"
          (click)="eventClick.emit(ev); $event.stopPropagation()"
          (keydown.enter)="eventClick.emit(ev); $event.stopPropagation()">
          @if (ev.startTime) { {{ ev.startTime }} }
          {{ ev.title }}
        </span>
      }
      @if (day.events.length > MAX_PILLS) {
        <span class="cal-month__more">+{{ day.events.length - MAX_PILLS }} more</span>
      }
    </button>
  }
</div>
