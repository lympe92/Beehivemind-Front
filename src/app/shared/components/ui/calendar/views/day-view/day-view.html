@if (!dayEvents().length) {
  <div class="cal-day__empty">Nothing scheduled.</div>
} @else {
  <div class="cal-day">
    @for (ev of dayEvents(); track ev.id) {
      <button
        type="button"
        class="cal-day__event"
        [style.border-left-color]="color(ev.color)"
        (click)="eventClick.emit(ev)">
        <span class="cal-day__time">{{ timeRange(ev) || 'All day' }}</span>
        <span>{{ ev.title }}</span>
      </button>
    }
  </div>
}
