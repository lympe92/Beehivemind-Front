<div class="cal-week">
  @for (day of days(); track day.date.getTime()) {
    <div class="cal-week__col">
      <button type="button" class="cal-week__head" (click)="dayClick.emit(day.date)">
        <span class="cal-week__dow">{{ weekday(day.date) }}</span>
        <span class="cal-month__num" [class.cal-month__num--today]="day.isToday">
          {{ day.date.getDate() }}
        </span>
      </button>

      <div class="cal-week__events">
        @for (ev of day.events; track ev.id) {
          <button
            type="button"
            class="cal-event"
            [style.background]="chipBg(ev.color)"
            [style.box-shadow]="chipBar(ev.color)"
            [title]="ev.title"
            (click)="eventClick.emit(ev)">
            @if (ev.startTime) { {{ ev.startTime }} }
            {{ ev.title }}
          </button>
        }
      </div>
    </div>
  }
</div>
