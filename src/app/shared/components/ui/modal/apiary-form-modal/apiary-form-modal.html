<app-modal-shell [title]="title" (close)="close()">

  <form [formGroup]="form" class="form-stack" (ngSubmit)="submit()" novalidate>

    <app-form-input
      formControlName="name"
      label="Name"
      inputType="text" />

    <div class="form-row">
      <app-form-input
        formControlName="hivesNumber"
        label="Hives"
        inputType="number"
        [noSpinners]="true" />
      <app-form-input
        formControlName="dateEstablished"
        label="Date Established"
        inputType="date" />
    </div>

    <app-form-input
      formControlName="location"
      label="Location"
      [placeholder]="geocoding() ? 'Detecting location…' : 'Click the map or type manually'" />

    <div class="form-group">
      <span class="form-label">
        <span>Coordinates *</span>
        @if (coordinatesError()) {
          <span class="apiary-form__map-error">Click the map to set a location</span>
        }
      </span>
      <!-- Coordinates can only be set by clicking the map: a beekeeper knows
           where the apiary is, not its decimal degrees. -->
      <div class="apiary-form__map" [class.apiary-form__map--error]="coordinatesError()">
        <app-map-picker
          [marker]="marker()"
          (markerChange)="onMarkerChange($event)" />
      </div>
    </div>

  </form>

  <ng-template #footer>
    <button class="app-btn app-btn--ghost" type="button" (click)="close()">Cancel</button>
    <button class="app-btn app-btn--primary" type="button" (click)="submit()">
      {{ isEdit ? 'Save' : 'Add' }}
    </button>
  </ng-template>

</app-modal-shell>
