<app-modal-shell [title]="data.title || 'Confirm'" (close)="cancel()">
  <p class="confirm__message">{{ data.message }}</p>

  <ng-template #footer>
    <button type="button" class="app-btn app-btn--ghost" (click)="cancel()">
      {{ data.cancelLabel || 'Cancel' }}
    </button>
    <button
      type="button"
      class="app-btn app-btn--ghost"
      [class.app-btn--danger-solid]="data.danger"
      [class.app-btn--primary]="!data.danger"
      (click)="confirm()">
      {{ data.confirmLabel || 'Confirm' }}
    </button>
  </ng-template>
</app-modal-shell>
