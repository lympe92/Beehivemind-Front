<div class="auth-page">
  <a routerLink="/" class="auth-brand" aria-label="BeehiveMind home">
    <!-- The transparent file: logo.webp carries a white box. -->
    <img src="/assets/img/logotr.webp" alt="BeehiveMind" width="44" height="44" />
  </a>

  <div class="auth-card">
    @if (title()) {
      <div class="auth-card__header">
        <h1>{{ title() }}</h1>
        @if (subtitle()) {
          <p>{{ subtitle() }}</p>
        }
      </div>
    }
    <ng-content />
  </div>

  <p class="auth-page__legal">
    <a routerLink="/terms">Terms</a>
    ·
    <a routerLink="/privacy">Privacy</a>
  </p>
</div>
