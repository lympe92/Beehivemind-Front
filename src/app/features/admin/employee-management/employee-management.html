<div class="app-page">
  <div class="app-page-header">
    <h1 class="app-page-title">Employees</h1>
    <button type="button" class="app-btn app-btn--primary" (click)="openCreate()">+ Add employee</button>
  </div>

  @if (error()) {
    <app-error [message]="error()!" [retry]="true" (retried)="loadEmployees()" />
  } @else {
    <app-card [flush]="true">
      <app-data-table
        [columns]="columns"
        [rows]="employees()"
        [loading]="loading()"
        emptyMessage="No employees yet.">

        <ng-template #cellTpl let-row let-col="col">
          @switch (col.key) {
            @case ('name') { {{ row.name }} {{ row.surname }} }
            <!-- A role is a fact about an employee, not a state. -->
            @case ('role') { <span class="app-badge app-badge--neutral">{{ row.role }}</span> }
            @case ('created_at') { {{ row.created_at | slice:0:10 }} }
            @default { {{ row[col.key] ?? '—' }} }
          }
        </ng-template>

        <ng-template #actionsTpl let-row>
          <button type="button" class="app-btn app-btn--ghost app-btn--sm" (click)="openEdit(row)">Edit</button>
          <button type="button" class="app-btn app-btn--danger app-btn--sm" (click)="deleteEmployee(row)">Delete</button>
        </ng-template>

      </app-data-table>
    </app-card>
  }
</div>
