<div class="app-page">
  <div class="app-page-header">
    <h1 class="app-page-title">Raw data</h1>
  </div>

  <p class="app-page-lead">
    Direct access to every registered table. A new table appears here by being
    added to the registry — the list, the columns and the edit form are all
    derived from that one entry.
  </p>

  <div class="admin-models">
    @for (m of models; track m.key) {
      <a [routerLink]="['/admin/raw', m.key]" class="admin-model">
        <span class="admin-model__label">{{ m.label }}</span>
        <span class="admin-model__count">{{ getCount(m.key) | number }}</span>
        <span class="admin-model__action">View all →</span>
      </a>
    }
  </div>
</div>
