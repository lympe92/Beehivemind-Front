<div class="app-page">
  <div class="app-page-header">
    <h1 class="app-page-title">My profile</h1>
  </div>

  <div class="app-page-narrow">
    <app-card title="Change password">
      @if (successMessage()) {
        <app-callout tone="success">{{ successMessage() }}</app-callout>
      }
      @if (errorMessage()) {
        <app-callout tone="error">{{ errorMessage() }}</app-callout>
      }
      <app-form
        [fields]="fields"
        submitLabel="Change password"
        [loading]="saving()"
        (submitForm)="savePassword($event)" />
    </app-card>
  </div>
</div>
