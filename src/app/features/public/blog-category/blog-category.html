<main>
  @if (category(); as cat) {
    <section app-page-intro
      eyebrow="Blog"
      [title]="cat.name"
      [lead]="cat.description ?? ''"></section>

    <section app-post-list
      [posts]="posts()"
      [chips]="chips()"
      emptyMessage="Nothing published in this category yet."></section>
  } @else if (unavailable()) {
    <!-- The category may well exist; we could not reach the API. The response
         is a 503, and the wording has to match that rather than claim a 404. -->
    <section app-page-intro
      eyebrow="Blog"
      title="Temporarily unavailable"
      lead="This page could not be loaded just now. Please try again shortly."></section>
  } @else if (loaded()) {
    <section app-page-intro
      eyebrow="Blog"
      title="Category not found"
      lead="There is no category at this address. It may have been renamed."></section>

    <section app-post-list [chips]="chips()"></section>
  }

  <section app-cta-banner
    [title]="ctaBanner.title"
    [description]="ctaBanner.description ?? ''"
    [cta]="ctaBanner.cta"></section>
</main>
