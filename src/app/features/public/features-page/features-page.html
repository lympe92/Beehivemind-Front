<main>
  <section app-hero-center-content
    [title]="page.hero.title"
    [subtitle]="page.hero.subtitle"
    [image]="page.hero.image"
    [primaryCta]="page.hero.primaryCta"
    [secondaryCta]="page.hero.secondaryCta"></section>

  @for (list of page.splitListsPre; track list.title; let i = $index) {
    <section app-split-list
      [title]="list.title"
      [image]="list.image"
      [items]="list.items"
      [cta]="list.cta"
      [mediaSide]="side(i)"></section>
  }

  <section app-ribbon
    [mode]="page.ribbon.mode"
    [quote]="page.ribbon.quote"></section>

  @for (list of page.splitListsPost; track list.title; let i = $index) {
    <section app-split-list
      [title]="list.title"
      [image]="list.image"
      [items]="list.items"
      [cta]="list.cta"
      [mediaSide]="side(i, page.splitListsPre.length)"></section>
  }

  <section app-cta-banner
    [title]="page.ctaBanner.title"
    [description]="page.ctaBanner.description ?? ''"
    [cta]="page.ctaBanner.cta"
    [secondary]="page.ctaBanner.secondary"></section>
</main>
