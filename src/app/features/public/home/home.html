<main>
  <section app-hero-left-content
    [title]="page.hero.title"
    [subtitle]="page.hero.subtitle"
    [image]="page.hero.image"
    [primaryCta]="page.hero.primaryCta"
    [secondaryCta]="page.hero.secondaryCta"
    [proof]="page.hero.proof ?? []"></section>

  <section app-ribbon
    [mode]="page.ribbon1.mode"
    [quote]="page.ribbon1.quote"
    [author]="page.ribbon1.author"></section>

  <section app-split-content
    [title]="page.productShot.title"
    [description]="page.productShot.description"
    [steps]="page.productShot.steps ?? []"
    [image]="page.productShot.image"
    mediaSide="end"></section>

  <section app-split-accordion
    [title]="page.splitAccordion.title"
    [image]="page.splitAccordion.image"
    [items]="page.splitAccordion.items"></section>

  <section app-features-row
    [items]="page.featuresRow.items"
    [cta]="page.featuresRow.cta"></section>

  <section app-ribbon
    [mode]="page.ribbon2.mode"
    [quote]="page.ribbon2.quote"
    [author]="page.ribbon2.author"></section>

  <section app-split-list
    [title]="page.splitList.title"
    [items]="page.splitList.items"
    [image]="page.splitList.image"
    [cta]="page.splitList.cta"></section>

  <section app-pricing-tiers
    [title]="page.pricing.title"
    [note]="page.pricing.note ?? ''"
    [tiers]="page.pricing.tiers"></section>

  <section app-application-download
    [title]="page.applicationDownload.title"
    [subtitle]="page.applicationDownload.subtitle"
    [logo]="page.applicationDownload.logo"
    [storeLinks]="page.applicationDownload.storeLinks"></section>

  <section app-info-columns
    [mode]="page.infoColumns.mode ?? 'default'"
    [title]="page.infoColumns.title"
    [items]="page.infoColumns.items"></section>

  <section app-cta-banner
    [title]="page.ctaBanner.title"
    [description]="page.ctaBanner.description ?? ''"
    [cta]="page.ctaBanner.cta"></section>
</main>
