<main>
  <section app-hero-center-content
    [title]="page.hero.title"
    [subtitle]="page.hero.subtitle"
    [image]="page.hero.image"
    [primaryCta]="page.hero.primaryCta"
    [secondaryCta]="page.hero.secondaryCta"></section>

  @for (content of page.splitContents; track content.title; let i = $index) {
    <section app-split-content
      [title]="content.title"
      [description]="content.description"
      [image]="content.image"
      [mediaSide]="side(i)"></section>
  }

  <section app-info-columns
    [title]="page.infoColumns.title"
    [items]="page.infoColumns.items"></section>

  <section app-cta-banner
    [title]="page.ctaBanner.title"
    [description]="page.ctaBanner.description ?? ''"
    [cta]="page.ctaBanner.cta"
    [secondary]="page.ctaBanner.secondary"></section>
</main>
