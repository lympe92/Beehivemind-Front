<main>

    [secondaryCta]="page.hero.secondaryCta"></section>

  <section app-split-accordion
    [title]="page.splitAccordion1.title"

  <section app-features-list-cta
    [title]="page.featuresListCta.title"
    [items]="page.featuresListCta.items"
    [ctaHref]="page.featuresListCta.ctaHref"

  <section app-split-accordion
    [title]="page.splitAccordion2.title"
    [image]="page.splitAccordion2.image"
    [items]="page.splitAccordion2.items"></section>

  <section app-cta-banner
    [title]="page.ctaBanner1.title"
    [cta]="page.ctaBanner1.cta"></section>

  <section app-info-columns
    [title]="page.infoColumns.title"
    [items]="page.infoColumns.items"></section>

  <section app-cta-banner
    [title]="page.ctaBanner2.title"

    [secondary]="page.ctaBanner2.secondary"></section>
