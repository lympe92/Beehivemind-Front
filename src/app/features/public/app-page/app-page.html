<main>
  <section app-hero-left-content
    [title]="page.hero.title"
    [subtitle]="page.hero.subtitle"
    [image]="page.hero.image"
    [primaryCta]="page.hero.primaryCta"
    [secondaryCta]="page.hero.secondaryCta"></section>

  <section app-ribbon
    [mode]="page.ribbon.mode"
    [quote]="page.ribbon.quote"></section>

  <section app-split-content
    [title]="page.splitContent.title"
    [description]="page.splitContent.description"
    [image]="page.splitContent.image"></section>

  <section app-text-columns [columns]="page.textColumns"></section>

  <section app-split-accordion
    [title]="page.splitAccordion1.title"
    [image]="page.splitAccordion1.image"
    [items]="page.splitAccordion1.items"></section>

  <section app-application-download
    [title]="page.applicationDownload.title"
    [subtitle]="page.applicationDownload.subtitle"
    [logo]="page.applicationDownload.logo"
    [storeLinks]="page.applicationDownload.storeLinks"></section>

  <section app-split-accordion
    [title]="page.splitAccordion2.title"
    [image]="page.splitAccordion2.image"
    [items]="page.splitAccordion2.items"></section>

  <section app-split-accordion
    [title]="page.questions.title"
    [image]="page.questions.image"
    [items]="page.questions.items"></section>

  <section app-info-columns
    [title]="page.infoColumns.title"
    [items]="page.infoColumns.items"></section>

  <section app-cta-banner
    [title]="page.ctaBanner.title"
    [description]="page.ctaBanner.description ?? ''"
    [cta]="page.ctaBanner.cta"
    [secondary]="page.ctaBanner.secondary"></section>
</main>
