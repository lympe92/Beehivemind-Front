<app-auth-card
  title="Two-Factor Authentication"
  [subtitle]="useBackup ? 'Enter one of your backup codes' : 'Enter the 6-digit code from your authenticator app'">

  @if (error$ | async; as error) {
    <div class="auth-form__error" role="alert">{{ error }}</div>
  }

  <form class="auth-form" (ngSubmit)="submit()" novalidate>
    @if (!useBackup) {
      <div class="form-group">
        <label class="form-label" for="tfa-code">Authentication Code</label>
        <input
          id="tfa-code"
          class="form-control tfa-code-input"
          type="text"
          inputmode="numeric"
          maxlength="6"
          [(ngModel)]="code"
          name="code"
          placeholder="000000"
          autocomplete="one-time-code" />
      </div>
    } @else {
      <div class="form-group">
        <label class="form-label" for="tfa-backup">Backup Code</label>
        <input
          id="tfa-backup"
          class="form-control"
          type="text"
          [(ngModel)]="backupCode"
          name="backupCode"
          placeholder="XXXX-XXXX"
          autocomplete="off" />
      </div>
    }

    <button
      type="submit"
      class="btn btn--md btn--primary btn--full"
      [disabled]="(loading$ | async) || (!useBackup && code.length !== 6) || (useBackup && !backupCode.trim())">
      @if (loading$ | async) { Verifying... } @else { Verify }
    </button>
  </form>

  <div class="tfa-footer">
    <button type="button" class="tfa-link" (click)="toggleBackup()">
      @if (!useBackup) { Use a backup code instead } @else { Use authenticator app }
    </button>
    <button type="button" class="tfa-link tfa-link--muted" (click)="backToLogin()">Back to login</button>
  </div>
</app-auth-card>
