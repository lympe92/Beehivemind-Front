<app-auth-card title="One last step" subtitle="Where are your apiaries located?">
  @if (error()) {
    <div class="auth-form__error" role="alert">{{ error() }}</div>
  }

  <div class="auth-form">
    <div class="form-group">
      <label class="form-label" for="profile-country">Country</label>
      <select id="profile-country" class="form-select" (change)="onCountryChange($event)" autocomplete="country-name">
        <option value="">Select your country</option>
        @for (c of countries; track c.code) {
          <option [value]="c.code">{{ c.name }}</option>
        }
      </select>
    </div>

    <button
      type="button"
      class="btn btn--md btn--primary btn--full"
      (click)="submit()"
      [disabled]="!selectedCountry || loading()">
      {{ loading() ? 'Saving...' : 'Continue' }}
    </button>
  </div>

  <p class="auth-card__footer">
    <button type="button" class="auth-link-btn" (click)="skip()">Skip for now</button>
  </p>
</app-auth-card>
