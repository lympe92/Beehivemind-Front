@if (state() === 'loading') {
  <app-auth-card title="Confirming your email..." subtitle="Please wait a moment." />
} @else if (state() === 'success') {
  <app-auth-card title="Email confirmed!" subtitle="Your account is now active.">
    <div class="auth-info">You can now sign in to your BeehiveMind account.</div>
    <p class="auth-card__footer"><a routerLink="/auth/login">Go to login</a></p>
  </app-auth-card>
} @else {
  <app-auth-card title="Confirmation failed" subtitle="The link may be invalid or expired.">
    <div class="auth-form__error" role="alert">Invalid or expired confirmation token.</div>
    <p class="auth-card__footer"><a routerLink="/auth/login">Back to login</a></p>
  </app-auth-card>
}
