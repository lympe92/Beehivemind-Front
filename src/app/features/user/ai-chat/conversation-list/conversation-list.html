<div class="conv-list">
  @if (loading() && conversations().length === 0) {
    <div class="app-state">Loading…</div>
  }

  @if (!loading() && conversations().length === 0) {
    <div class="app-state">No conversations yet.</div>
  }

  @for (conv of conversations(); track trackById($index, conv)) {
    <div class="conv-list__row" [class.conv-list__row--active]="conv.id === activeId()">
      <button type="button" class="conv-list__item" (click)="select(conv.id)" [attr.aria-current]="conv.id === activeId() ? 'true' : null">
        <span class="conv-list__title">{{ conv.title }}</span>
        <span class="conv-list__date">{{ conv.last_message_at | date:'d MMM' }}</span>
      </button>
      <button type="button" class="conv-list__delete" aria-label="Delete conversation" (click)="delete($event, conv.id)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
