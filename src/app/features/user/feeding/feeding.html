<div class="app-page">

  <app-filter-bar
    [apiaries]="apiaries()"
    [beehives]="beehives()"
    [apiaryId]="selectedApiaryId()"
    (apiaryIdChange)="onApiaryChange($event)"
    [beehiveId]="selectedBeehiveId()"
    (beehiveIdChange)="onBeehiveChange($event)" />

  <app-card title="Feeding Data" [flush]="true">
    <button card-header-end type="button" class="app-btn app-btn--primary" (click)="startAdd()">+ Add Record</button>

    <app-data-table
      [columns]="columns"
      [rows]="feeding()"
      [loading]="loading()"
      [showActions]="true"
      emptyMessage="No feeding records found.">

      <ng-template #cellTpl let-row let-col="col">
        @switch (col.key) {
          @case ('beehiveId') { <span class="dt__nowrap">{{ beehiveName(row.beehiveId) }}</span> }
          @case ('date') { <span class="dt__nowrap">{{ row.date | date:'mediumDate' }}</span> }
          @case ('food_quantity') { <span class="dt__nowrap">{{ row.food_quantity }} {{ row.unit }}</span> }
          @default { {{ row[col.key] ?? '—' }} }
        }
      </ng-template>

      <ng-template #actionsTpl let-row>
        <button type="button" class="app-btn app-btn--ghost app-btn--sm" (click)="startEdit(row)">Edit</button>
        <button type="button" class="app-btn app-btn--danger app-btn--sm" (click)="deleteRow(row)">Delete</button>
      </ng-template>

    </app-data-table>
  </app-card>

</div>
