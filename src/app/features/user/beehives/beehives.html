<div class="app-page">

  <!-- Filters + bulk create -->
  <app-filter-bar
    [apiaries]="apiaries()"
    [apiaryId]="selectedApiaryId()"
    (apiaryIdChange)="onApiaryChange($event)">

    @if (selectedApiaryId() !== 0) {
      <div class="fb__group">
        <label class="fb__label" for="bh-count">Beehives to Create</label>
        <div style="display: flex; align-items: center; gap: 8px">
          <input id="bh-count" class="app-input app-input--sm" type="number" min="1"
                 [(ngModel)]="beehivesToCreate" name="count" placeholder="0" />
          <button type="button" class="app-btn app-btn--primary app-btn--sm" (click)="addBeehives()">Create</button>
        </div>
      </div>
    }

  </app-filter-bar>

  <app-card title="Beehives" [flush]="true">
    <app-data-table
      [columns]="columns"
      [rows]="beehives()"
      [loading]="loading()"
      [editingId]="editingId"
      emptyMessage="No beehives found.">

      <ng-template #cellTpl let-row let-col="col" let-i="index">
        @switch (col.key) {
          @case ('_idx') { <span class="dt__muted">{{ i + 1 }}</span> }
          @case ('queen_year') { {{ row.queen?.year ?? '—' }} }
          @default { {{ row[col.key] ?? '—' }} }
        }
      </ng-template>

      <ng-template #editRowTpl let-row let-i="index">
        <td><span class="dt__muted">{{ i + 1 }}</span></td>
        <td>
          <input class="app-input" [(ngModel)]="editForm.name" name="edit_name"
                 placeholder="Beehive name" aria-label="Beehive name" />
        </td>
        <td>
          <input class="app-input app-input--sm" type="number" min="2000" [(ngModel)]="editForm.queen_year"
                 name="edit_qy" placeholder="e.g. 2023" aria-label="Queen year" />
        </td>
        <td class="dt__actions">
          <button type="button" class="app-btn app-btn--primary app-btn--sm" (click)="confirmEdit()">Save</button>
          <button type="button" class="app-btn app-btn--ghost app-btn--sm" (click)="cancelEdit()">Cancel</button>
        </td>
      </ng-template>

      <ng-template #actionsTpl let-row>
        <button type="button" class="app-btn app-btn--ghost app-btn--sm" (click)="showQr(row)">QR</button>
        <button type="button" class="app-btn app-btn--ghost app-btn--sm" (click)="startEdit(row)">Edit</button>
        <button type="button" class="app-btn app-btn--danger app-btn--sm" (click)="deleteRow(row)">Delete</button>
      </ng-template>

    </app-data-table>
  </app-card>

</div>
